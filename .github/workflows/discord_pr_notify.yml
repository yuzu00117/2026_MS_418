# PR 作成時に Discord のフォーラムチャンネルへ通知するワークフロー。
#  (1) develop 向けの PR、および develop → main の PR が opened / reopened / ready_for_review になったとき、
#      PR ごとに新規スレッド(投稿)を Webhook で作成する。
#  (2) 必要な Secret: DISCORD_WEBHOOK_URL (フォーラムチャンネルの Webhook URL)
#  (3) スレッド作成後、Discord のスレッド ID を隠しマーカー付きコメント(<!-- discord-thread-id:ID -->)として PR に保存する。
#      discord_coderabbit_notify.yml がこの ID を読み取り、CodeRabbit のレビュー状況を同じスレッドへ追記する。
#  (4) 必要な Variables(Secret ではない。未設定でも通知自体は行われ、メンションのみ省略される):
#      DISCORD_REVIEWER_USER_ID: PR のレビュー・確認を担当する人の Discord ユーザー ID(数字のみ・引用符なし)。PR が作られるたびに必ずメンションする
#      DISCORD_GITHUB_TO_DISCORD_ID_MAP: GitHub ログイン名 → Discord ユーザー ID の JSON オブジェクト。PR 作成者のメンションに使う
#                        例: {"yuzu00117":"123456789012345678"}
#                        対応表にない作成者は、メンションせずプレーンテキストで表示する。
#  (5) workflow_dispatch(input: pr_number)でも起動できる。retarget-pr-base.yml が GITHUB_TOKEN で base を main から
#      develop に付け替えても、GITHUB_TOKEN の操作では他のワークフローが起動しないため、付け替え後に
#      retarget-pr-base.yml がこのワークフローを dispatch する。dispatch 時は gh pr view で PR 情報を取得し、
#      Draft・フォーク PR・main 向け(head が develop 以外)のいずれかなら何もせず正常終了する。
#  (6) 重複投稿防止: 投稿前に PR コメントを確認し、github-actions[bot] が投稿した
#      <!-- discord-thread-id:数字 --> 形式のマーカーがあれば、何もせず正常終了する(通常経路・dispatch 経路の両方)。
#      github-actions[bot] 以外(人間のコメント)に同じ文字列があっても対象外。
#      同じ PR の reopened などでは再通知しない(スレッドを増やさない)。
name: Discord PR Notify

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 通知対象の PR 番号
        required: true
        type: string
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [develop, main]

jobs:
  notify:
    runs-on: ubuntu-latest
    # 最小権限にする。必要なのは PR コメント投稿のみ。
    # スレッド ID を PR コメントに保存するため pull-requests: write が必要。
    permissions:
      contents: read
      pull-requests: write
    # 実行条件:
    #  - Draft PR は opened 時には通知せず、ready_for_review になった時点で通知する
    #  - フォーク PR は Secrets が渡らず失敗するので、同一リポジトリの PR のみ対象にする
    #  - Bot 起因のイベントは除外する
    #  - main 向けは develop → main の PR のみ対象にする。main 向けの feature/* PR は
    #    retarget-pr-base.yml が develop に付け替えるため、ここで通知すると二重・不正確になる
    #  - workflow_dispatch 時はジョブ側では通し、スクリプト内で同等の判定(Draft・フォーク・main 向け)を行う
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref == 'develop'))
    steps:
      - name: Create Discord forum thread
        env:
          # Webhook URL は直書きせず、必ず secrets 経由で渡す。
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # PR タイトル・本文・ブランチ名などユーザー入力由来の値は、
          # スクリプトインジェクションを避けるため ${{ }} をシェル内に展開せず env 経由で参照する。
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          # workflow_dispatch 時のみ使う入力(PR 番号)とイベント名。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          # レビュー担当者の Discord ユーザー ID と、GitHub ログイン名 → Discord ユーザー ID の対応表(Variables 由来)。
          REVIEWER_USER_ID: ${{ vars.DISCORD_REVIEWER_USER_ID }}
          GITHUB_TO_DISCORD_ID_MAP: ${{ vars.DISCORD_GITHUB_TO_DISCORD_ID_MAP }}
          # PR コメント投稿用。
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # set -x は使わない(Webhook URL をログに出さないため)。
          set -euo pipefail

          # workflow_dispatch 時は gh pr view で PR 情報を取得し、PR_* を上書きする。
          # 値は JSON として受け取り jq で取り出す(シェルに展開して評価しない)。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number は数字で指定してください。"
              exit 1
            fi
            pr_json="$(gh pr view "$INPUT_PR_NUMBER" --repo "$REPO" \
              --json number,title,body,url,author,headRefName,baseRefName,createdAt,isDraft,isCrossRepository)"
            PR_NUMBER="$(jq -r '.number' <<< "$pr_json")"
            PR_TITLE="$(jq -r '.title' <<< "$pr_json")"
            PR_BODY="$(jq -r '.body // ""' <<< "$pr_json")"
            PR_URL="$(jq -r '.url' <<< "$pr_json")"
            PR_AUTHOR="$(jq -r '.author.login' <<< "$pr_json")"
            PR_HEAD="$(jq -r '.headRefName' <<< "$pr_json")"
            PR_BASE="$(jq -r '.baseRefName' <<< "$pr_json")"
            PR_CREATED_AT="$(jq -r '.createdAt' <<< "$pr_json")"
            is_draft="$(jq -r '.isDraft' <<< "$pr_json")"
            is_cross="$(jq -r '.isCrossRepository' <<< "$pr_json")"

            # ジョブ側の if と同等の判定。満たさない場合は何もせず正常終了する。
            if [ "$is_draft" = "true" ]; then
              echo "Draft PR のため通知しません。"
              exit 0
            fi
            if [ "$is_cross" = "true" ]; then
              echo "フォーク PR のため通知しません。"
              exit 0
            fi
            if [ "$PR_BASE" = "main" ] && [ "$PR_HEAD" != "develop" ]; then
              echo "main 向け(develop 以外)の PR のため通知しません。"
              exit 0
            fi
          fi

          # 重複投稿防止: すでにスレッド ID コメントがあれば何もしない。
          existing="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | test("<!-- discord-thread-id:[0-9]+ -->")))] | length' \
            | awk '{s+=$1} END {print s+0}')"
          if [ "$existing" -gt 0 ]; then
            echo "すでに Discord に通知済みのため、何もしません。"
            exit 0
          fi

          # JSON は jq で組み立てる(引用符・改行・メンションを安全に扱うため)。
          # - thread_name は Discord の上限 100 文字に収める
          # - description は先頭 300 文字に切り詰め、空なら「(説明なし)」
          # - allowed_mentions は users に指定した ID(レビュー担当者・PR作成者)のみ許可する。
          #   parse は空のままにして、PR 本文由来の @everyone や @here を無効化する
          # - content にレビュー担当者のメンションと PR 作成者の表示を入れる(対応表に無ければプレーンテキスト)
          payload="$(jq -n \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg created_at "$PR_CREATED_AT" \
            --arg reviewer_id "$REVIEWER_USER_ID" \
            --arg id_map "$GITHUB_TO_DISCORD_ID_MAP" \
            '
            # Discord ID は数字のみ有効とする
            def is_id: type == "string" and test("^[0-9]+$");
            ("#" + $number + " " + $title) as $thread
            | ($body | if length > 300 then .[0:300] + "…" else . end) as $excerpt
            # 対応表は空文字・不正JSON・オブジェクト以外でも落ちずに {} 扱いにする
            | (try ($id_map | fromjson) catch null) as $map0
            | (if ($map0 | type) == "object" then $map0 else {} end) as $map
            | ($map[$author] | if is_id then . else null end) as $author_id
            | ($reviewer_id | if is_id then . else null end) as $rid
            # 2行目: 作成者の表示(対応表に無い・無効なら plain text、レビュー担当者と同じなら重複メンションを避ける)
            | (if $author_id == null then "PR作成者 @" + $author
               elif $author_id == $rid then "PR作成者 (上と同じ)"
               else "PR作成者 <@" + $author_id + ">" end) as $author_line
            # 1行目: レビュー担当者のメンション(無効なら出さない)
            | ([ (if $rid == null then empty else "<@" + $rid + ">" end), $author_line ] | join("\n")) as $content
            | ([$rid, $author_id] | map(select(. != null)) | unique) as $users
            | {
                thread_name: (if ($thread | length) > 100 then $thread[0:99] + "…" else $thread end),
                content: $content,
                allowed_mentions: { parse: [], users: $users },
                embeds: [{
                  title: ($title | if length > 256 then .[0:255] + "…" else . end),
                  url: $url,
                  description: (if ($excerpt | gsub("\\s"; "") | length) == 0 then "(説明なし)" else $excerpt end),
                  color: 5793266,
                  timestamp: $created_at,
                  fields: [
                    { name: "作成者", value: $author, inline: true },
                    { name: "ブランチ", value: ($head + " → " + $base), inline: true }
                  ]
                }]
              }
            ')"

          # wait=true で保存完了を待ち、送信結果を確認する。成功時は投稿JSONを出力せず、失敗時(HTTP 4xx/5xx)のみ本文を出力して失敗させる。
          # URL は引数に渡すだけで echo しない。
          resp="$(printf '%s' "$payload" | curl -sS --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "${DISCORD_WEBHOOK_URL}?wait=true")" || { echo "$resp"; exit 1; }

          # フォーラム投稿の場合、レスポンスの channel_id がスレッド ID になる。数字のみであることを検証する。
          thread_id="$(printf '%s' "$resp" | jq -r '.channel_id // empty')"
          if ! [[ "$thread_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Discord のレスポンスからスレッド ID を取得できませんでした。"
            exit 1
          fi

          # 後続の discord_coderabbit_notify.yml が参照できるよう、スレッド ID を隠しマーカー付きコメントとして PR に保存する。
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$(printf '<!-- discord-thread-id:%s -->\nDiscord に通知しました。' "$thread_id")" > /dev/null
