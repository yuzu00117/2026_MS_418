# 毎日 21:00 JST 頃に、直近の 21:00 JST から 24 時間前までに develop へマージされた PR の機能紹介を Discord の進捗チャンネルへ投稿するワークフロー。
#  (1) 必要な Secret: DISCORD_PROGRESS_WEBHOOK_URL (進捗チャンネルの Webhook URL)
#      PR 通知用の DISCORD_WEBHOOK_URL(フォーラム)は流用しない。未設定の場合はエラーで失敗する(dry_run 時を除く)。
#  (2) 対象は base=develop にマージされた PR。mergedAt が対象期間内のものだけに絞り、Bot 作成の PR は除外する。0 件の日は何も投稿しない。
#  (3) PR 本文の「## 概要」のみを抜粋し、「## 実行動画」(無ければ本文全体)の動画 URL を取得する。
#      動画は 10MB 超でも ffmpeg で圧縮して Webhook へファイル添付する。圧縮しても収まらない・取得失敗・1 PR あたりの添付数(3 件)/合計サイズ(10MB)の上限超過のときは、URL をリンクとして投稿する。
#  (4) workflow_dispatch の入力: hours(対象期間・時間, 既定 24) / dry_run(true なら投稿せずログ出力のみ)。
#  (5) 抽出・投稿のロジックは .github/scripts/discord_daily_digest.py。PR 本文はユーザー入力なので env 経由でのみ扱う。
#  (6) schedule はデフォルトブランチ(main)の定義で動く。main に取り込まれるまで定期実行は始まらない。
#  (7) GitHub の cron は 5〜9 時間遅れることがあり、21:17 の 1 回だけでは深夜 2〜6 時の投稿になっていた。
#      そのため昼から複数回起動し、21:00 前に起動した回は 21:00 まで待って投稿する。2 回目以降の回・深夜早朝(0〜9時)の回は何もしない。
#      判定はスクリプト側(decide_schedule / is_already_handled)。実行履歴を読むため actions: read が必要。
name: Discord Daily Digest

on:
  schedule:
    # 12:17〜20:17 JST に 2 時間おき + 21:17 JST(UTC で記述)。遅延を見越して早めに起動する。
    # 毎時 0 分の混雑を避けて 17 分にする。21:00 前に起動した回は 21:00 まで待つ。
    - cron: "17 3,5,7,9,11,12 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: 対象期間(直近何時間か)
        required: false
        default: "24"
        type: string
      dry_run:
        description: true なら Discord へ投稿せず、内容をログに出すだけにする
        required: false
        default: false
        type: boolean

concurrency:
  group: discord-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # 21:00 まで最大 5.5 時間待つため長めにする(GitHub ホストランナーの上限は 360 分)。
    timeout-minutes: 360
    # 最小権限にする。PR の読み取りと、二重投稿防止のための実行履歴の読み取りのみ。
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # スクリプトを取得するためにチェックアウトする。公式 Action は SHA 固定にする。
      - name: Checkout script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # ubuntu ランナーには ffmpeg が標準では入っておらず、10MB 超の動画が圧縮されずリンク表示になっていたため導入する。
      # 導入に失敗しても投稿は続け、動画はリンク表示になる(警告のみ出す)。
      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) || echo "::warning::ffmpeg の導入に失敗しました。動画はリンク表示になります"

      - name: Post daily digest to Discord
        env:
          # Webhook URL は直書きせず、必ず secrets 経由で渡す。
          DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
          # ユーザー入力由来の値は ${{ }} をシェルに展開せず env 経由で参照する。
          HOURS: ${{ github.event.inputs.hours }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # set -x は使わない(Webhook URL をログに出さないため)。
          set -euo pipefail
          python3 .github/scripts/discord_daily_digest.py
